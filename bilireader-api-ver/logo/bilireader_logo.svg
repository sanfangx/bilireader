<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24242C" />
      <stop offset="100%" stop-color="#0F0F13" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE192" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA821C" />
    </linearGradient>

    <linearGradient id="leftBookGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5A5A66" />
      <stop offset="100%" stop-color="#42424A" />
    </linearGradient>

    <linearGradient id="rightBookGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E0E0" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <filter id="deboss">
      <feOffset dx="0" dy="4"/>
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="blur" result="inverse"/>
      <feFlood flood-color="#4A3500" flood-opacity="0.8" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="225" fill="url(#bgGrad)" />

  <rect x="120" y="820" width="784" height="16" rx="8" fill="#1C1C22" filter="url(#shadow)" />

  <rect x="160" y="380" width="110" height="440" rx="12" fill="url(#leftBookGrad)" filter="url(#shadow)" />
  <line x1="175" y1="380" x2="175" y2="820" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.1" />

  <rect x="754" y="340" width="110" height="480" rx="12" fill="url(#rightBookGrad)" filter="url(#shadow)" />
  <line x1="770" y1="340" x2="770" y2="820" stroke="#000000" stroke-width="4" stroke-opacity="0.05" />

  <rect x="290" y="180" width="444" height="640" rx="24" fill="url(#goldGrad)" filter="url(#shadow)" />
  <line x1="320" y1="180" x2="320" y2="820" stroke="#FFFFFF" stroke-width="8" stroke-opacity="0.4" />
  <line x1="330" y1="180" x2="330" y2="820" stroke="#000000" stroke-width="4" stroke-opacity="0.05" />

  <text x="512" y="520" font-family="'PingFang TC', 'Hiragino Sans GB', 'Noto Sans TC', sans-serif" font-size="280" font-weight="900" fill="#6B4E00" text-anchor="middle" dominant-baseline="central" filter="url(#deboss)">嗶</text>

  <line x1="430" y1="720" x2="594" y2="720" stroke="#6B4E00" stroke-width="8" stroke-linecap="round" opacity="0.8" filter="url(#deboss)" />
  <line x1="470" y1="750" x2="554" y2="750" stroke="#6B4E00" stroke-width="8" stroke-linecap="round" opacity="0.8" filter="url(#deboss)" />
</svg>
